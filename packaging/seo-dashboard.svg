<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#1565C0"/>
  <!-- Magnifying glass ring -->
  <circle cx="210" cy="205" r="115" fill="none" stroke="white" stroke-width="38"/>
  <!-- Handle -->
  <line x1="295" y1="290" x2="415" y2="415" stroke="white" stroke-width="38" stroke-linecap="round"/>
  <!-- Upward trend line inside the glass -->
  <polyline
    points="130,250 178,195 230,218 285,148"
    fill="none"
    stroke="#90CAF9"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
